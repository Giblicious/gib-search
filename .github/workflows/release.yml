name: Release

on:
  push:
    tags:
      - "[0-9]+.[0-9]+.[0-9]+"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Verify tag and manifest
        shell: bash
        run: |
          VERSION=$(node -p "require('./manifest.json').version")
          test "$GITHUB_REF_NAME" = "$VERSION"
      - run: npm ci --no-audit --no-fund
      - run: npm run check
      - run: npm run audit:in-file
      - name: Publish complete release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          TAG="$GITHUB_REF_NAME"
          REQUIRED=(main.js manifest.json styles.css)
          if gh release view "$TAG" >/dev/null 2>&1; then
            ASSETS=$(gh release view "$TAG" --json assets --jq '.assets[].name')
            for FILE in "${REQUIRED[@]}"; do
              if ! grep -Fxq "$FILE" <<<"$ASSETS"; then
                gh release upload "$TAG" "$FILE"
              fi
            done
            exit 0
          fi
          gh release create "$TAG" "${REQUIRED[@]}" --draft --title "$TAG" --generate-notes
          gh release edit "$TAG" --draft=false
